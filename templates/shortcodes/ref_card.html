<a class="ref-card" href="{{ url }}" target="_blank" rel="noopener noreferrer">
    {% set _img = image | default(value="") %}
    {% if _img %}
    <img src="{{ _img }}" alt="{{ title }}" class="ref-card-img">
    {% endif %}
    <div class="ref-card-body">
        <span class="ref-card-title">{{ title }}</span>
        <span class="ref-card-domain">{{ url | replace(from="https://", to="") | replace(from="http://", to="") | split(pat="/") | first }}</span>
    </div>
    <svg class="ref-card-icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
    </svg>
</a>
